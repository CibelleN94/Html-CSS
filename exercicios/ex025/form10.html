<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 10</title>
</head>
<body>
   <h1>Formulário 10</h1> 
   <form action="cadastro.php" method="post" autocomplete="on">

   <p>
    <label for="iano">Data de nascimento</label>
    <input type="number" name="ano" id="iano" min="1900" max="2024" oninput="idade.innerHTML = ano_atual - Number(iano.value)">
   </p>
   
   <p>
    <label for="idade">Idade:</label>
    <output id="idade">0</output>
   
   </p>

   <p>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
   </p>
   </form>
   
   <script>
    let ano_atual = new Date().getFullYear();
</script>
</body>
</html>
