<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário para telefone e email</h1>
    <form action="cadastro.php"post" autocomplete="off">
    <fieldset>
        <legend>Dados pessoais</legend>
        <p>
            <label for="iemail">Email</label>
            <input type="email" name="Email" id="iemail" autocomplete="email" required>
        </p>
        <p>
            <label for="itelefone">Telefone</label>
            <input type="tel" name="telefone" id="itelefone" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" placeholder="(xx)xxxxx-xxxx" >
        </p>
    </fieldset>

    <p>
        <input type="submit" value="Enviar">
       <input type="reset" value="Limpar">
    </p>
</body>
</html>
