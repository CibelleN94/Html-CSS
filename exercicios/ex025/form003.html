<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 3</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get"></form>
    <p>
        <label for="inome">Nome:</label>
        <input type="text" name="Nome" id="inome" required maxlength="8" placeholder="Nome Completo" autocomplete="name">
    </p>
   <p>
    <label for="imedia">Media:</label>
    <input type="number" name="media" id="imedia" required step="0.5">
    </p>
    <p>
        <label for="idata">Data</label>
        <input type="date" name="data" id="idata"required>
    </p>
    
    <p>
        <label for="ihora">Hora</label>
        <input type="time" name="hora" id="ihora">
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>

</body>
</html>
