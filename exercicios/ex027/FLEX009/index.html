<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box 001</title>
    <style> 

        div.conteiner {
            display: flex;
            background-color: brown;
            flex-flow: row nowrap;

        }
        div.item {
            background-color: rgb(236, 228, 200);
            border: solid 2px black ;
            flex-basis: 200px;
            flex-shrink: 1;
            flex-grow: 1;
            
        }

        div#ib {
            color: blueviolet;
            text-align:center;
            font-size: 2.3em;
        }
    </style>
</head>
<body>
    <div class="conteiner">
     <div class="item">A</div>
     <div class="item" id="ib">Eu já sou vencedora e tenho muito sucesso.</div>
     <div class="item">C</div>
     <div class="item">D</div>
    </div>
    
</body>
</html>
