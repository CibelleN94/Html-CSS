<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box 001</title>
   
   <style> 

        div.conteiner {
            display: flex;
            background-color: brown;
            flex-flow: row nowrap;

        }

        div.item {
            background-color: rgb(236, 228, 200);
            border: solid 2px black ;
            text-align: center;
            flex-basis: 200px;        
            
        }

         
    </style>
</head>
<body>

    <div class="conteiner">
     <div class="item" id="cx1">A</div>
     <div class="item" id="cx2">Eu já sou vencedora e tenho muito sucesso.</div>
     <div class="item" id="cx3">C</div>
     <div class="item" id="cx4">D</div>
    </div>
    
</body>
</html>
