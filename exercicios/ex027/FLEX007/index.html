<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box 001</title>
    <style> 
        div.conteiner {
            display: flex;
            background-color: brown;
            flex-flow: row wrap;
        }
        div.item {
            background-color: rgb(236, 228, 200);
            border: solid 2px black ;
            padding: 20px;
        }
           
        div#i1 {
        order:2;
       
    }
        div#i2 {
            order:4;
            
        }
        div#i3 {
            order:-1;
            
        }
        div#i4 {
            order: 0;
            
        }
    
    </style>
</head>
<body>
    <div class="conteiner">
     <div class="item"id="i1">A</div>
     <div class="item"id="i2">B</div>
     <div class="item"id="i3">C</div>
     <div class="item"id="i4">D</div>
    </div>
    
</body>
</html>
