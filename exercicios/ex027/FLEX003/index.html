<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box 001</title>
    <style>
    

        section {
            height: 200px;
            width: 200px;
        }
        div.conteiner {
            display: flex;
            background-color: brown;
           flex-flow: row nowrap;
            
        }
        div.item {
            background-color: rgb(236, 228, 200);
            border: solid 2px black ;
        
            
        }
    </style>
</head>
<body>
    <main>
        <section>
    <div class="conteiner">
     <div class="item">Exemplo de bloco A</div>
     <div class="item">Exemplo de bloco B</div>
     <div class="item">Exemplo de bloco C</div>
     <div class="item">Exemplo de bloco D</div>
    </div>
    </section>
    </main>
    
</body>
</html>
